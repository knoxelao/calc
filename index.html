<!DOCTYPE html>
<html lang="ru">
<head>

<link rel="manifest" href="manifest.json">
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор курса валюты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 8px;
            text-align: left;
            width: 50%;
        }
        input {
            width: 100%;
            padding: 6px;
            font-size: 16px;
            -moz-appearance: textfield;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .advanced-settings {
            display: none;
        }
        .divider {
            border-top: 2px solid #ccc;
            margin: 15px 0;
        }
        .highlight {
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Калькулятор курса валюты</h2>
    
    <table>
        <tr>
            <td>Курс</td>
            <td><input type="number" id="exchangeRate" step="0.0001" placeholder="Введите курс" oninput="calculateExchange()"></td>
        </tr>
        <tr>
            <td>Без комиссии</td>
            <td><input type="number" id="amountNoFee" step="0.01" placeholder="Введите сумму" oninput="calculateExchange()"></td>
        </tr>
        <tr>
            <td>С комиссией</td>
            <td><input type="number" id="amountWithFee" step="0.01" placeholder="Введите сумму" oninput="calculateExchange()"></td>
        </tr>
    </table>
    
    <div class="divider"></div>
    
    <table>
        <tr>
            <td colspan="2" class="toggle-container">
                <input type="checkbox" id="toggleAdvanced" onchange="toggleAdvancedSettings()">
                <label for="toggleAdvanced">Дополнительно</label>
            </td>
        </tr>
    </table>
    
    <div id="advancedSettings" class="advanced-settings">
        <table>
            <tr>
                <td>Комиссия</td>
                <td><input type="number" id="feeRate" step="0.01" placeholder="0.9" value="0.9" oninput="calculateExchange()"></td>
            </tr>
            <tr>
                <td>Минимум</td>
                <td><input type="number" id="minFee" step="1" placeholder="500" value="500" oninput="calculateExchange()"></td>
            </tr>
            <tr>
                <td>Максимум</td>
                <td><input type="number" id="maxFee" step="1" placeholder="5000" value="5000" oninput="calculateExchange()"></td>
            </tr>
        </table>
    </div>
    
    <div class="divider"></div>
    
    <table>
        <tr>
            <td>Итого</td>
            <td id="resultAmount"></td>
        </tr>
        <tr>
            <td>Курс</td>
            <td id="resultRate" class="highlight"></td>
        </tr>
    </table>
    
    <script>
        function toggleAdvancedSettings() {
            let advancedSettings = document.getElementById("advancedSettings");
            advancedSettings.style.display = document.getElementById("toggleAdvanced").checked ? "block" : "none";
            calculateExchange();
        }
        
function calculateExchange() {
    let baseRate = parseFloat(document.getElementById("exchangeRate").value) || 0;
    let amountNoFee = parseFloat(document.getElementById("amountNoFee").value) || 0;
    let amountWithFee = parseFloat(document.getElementById("amountWithFee").value) || 0;
    let feeRate = parseFloat(document.getElementById("feeRate").value) / 100 || 0;
    let minFee = document.getElementById("minFee").value ? parseFloat(document.getElementById("minFee").value) : null;
    let maxFee = document.getElementById("maxFee").value ? parseFloat(document.getElementById("maxFee").value) : null;

    // Case 1: No base rate, fee is applied as-is
    if (baseRate === 0) {
        console.warn("Base rate is 0 or not provided, skipping multiplication by rate.");
    }

    let fee;
    
    // Apply min/max fee logic
    if (minFee !== null && maxFee !== null) {
        let calculatedFee = amountWithFee * feeRate;
        if (calculatedFee < minFee) {
            fee = minFee;
        } else if (calculatedFee > maxFee) {
            fee = maxFee;
        } else {
            fee = calculatedFee;
        }
    } else if (minFee !== null) { // No max fee given
        let calculatedFee = amountWithFee * feeRate;
        fee = calculatedFee < minFee ? minFee : calculatedFee;
    } else if (maxFee !== null) { // No min fee given
        let calculatedFee = amountWithFee * feeRate;
        fee = calculatedFee > maxFee ? maxFee : calculatedFee;
    } else { // No min or max fee, just apply base rate
        fee = amountWithFee * feeRate;
    }

    console.log("Applied Fee:", fee);

    // Subtract fee from amount with fee
    let finalAmountWithFee = amountWithFee - fee;

    // Convert to EUR if base rate is given
    let exchangedEURNoFee = amountNoFee > 0 && baseRate > 0 ? amountNoFee / baseRate : 0;
    let exchangedEURWithFee = finalAmountWithFee > 0 && baseRate > 0 ? finalAmountWithFee / baseRate : 0;

    let totalEUR = exchangedEURNoFee + exchangedEURWithFee;
    let totalRUB = amountNoFee + amountWithFee;

    let effectiveRate = totalEUR > 0 ? totalRUB / totalEUR : 0;

    console.log("Total EUR:", totalEUR);
    console.log("Total RUB:", totalRUB);
    console.log("Effective Exchange Rate:", effectiveRate);

    document.getElementById("resultAmount").innerText = `${totalEUR.toFixed(2)}`;
    document.getElementById("resultRate").innerText = `${effectiveRate.toFixed(2)}`;
}
    </script>
</body>
</html>
